# JVM Heap & Garbage Collection Optimization for Faster Builds
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

# Parallel Compilation & Daemon Controls
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=true

# Incremental Compilation for Kotlin & KSP (Compile only changed files)
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true

# Android Gradle Plugin Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=35
