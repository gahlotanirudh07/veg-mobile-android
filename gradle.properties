# JVM Heap & Garbage Collection Optimization for Faster Builds
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# Multi-Core Parallel Compilation & Persistent Daemon
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# Incremental Compilation for Kotlin & KSP (Compile only changed files)
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true

# Android Gradle Plugin Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=false
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=35
