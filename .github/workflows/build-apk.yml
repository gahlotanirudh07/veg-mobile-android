name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Test MandiExpress APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest -PversionCode=${{ github.run_number }} -PversionName=1.1.${{ github.run_number }} -PgitSha=${{ github.sha }} --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.1.${{ github.run_number }} -PgitSha=${{ github.sha }} --no-daemon

      - name: Rename APK for Release Distribution
        run: cp app/build/outputs/apk/debug/app-debug.apk MandiExpress.apk

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MandiExpress-Debug-APK
          path: MandiExpress.apk
          retention-days: 30

      - name: Publish to GitHub Releases (Continuous OTA Channel)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "MandiExpress v1.1.${{ github.run_number }} (Build #${{ github.run_number }})"
          body: |
            ## 🚀 MandiExpress Android App v1.1.${{ github.run_number }}

            - **Direct APK Download**: [MandiExpress.apk](https://github.com/gahlotanirudh07/veg-mobile-android/releases/latest/download/MandiExpress.apk)
            - **Version**: `1.1.${{ github.run_number }}`
            - **Build**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Built**: `${{ github.event.head_commit.timestamp || 'Latest Push' }}`
            
            ### ✨ Included Features:
            - 📲 **In-App OTA Self-Updater**: 1-tap download & install directly from within the app.
            - 🔢 **Direct Decimal Quantity Input**: Type 2.5, 3.5, 15 directly on catalogue cards.
            - ⚡ **Seller Fast Fulfill**: Pre-filled scale weights & 1-tap dispatch.
            - 🇮🇳 **Hindi + English Localization**: Authentic Mandi vocabulary with 1-tap language switch.
            - 🛡️ **Zero-Kill Resilience**: Auto-retry on database sleep/cold-start.
          files: MandiExpress.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
