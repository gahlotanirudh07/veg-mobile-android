name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Test MandiExpress APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Release Distribution
        run: cp app/build/outputs/apk/debug/app-debug.apk MandiExpress.apk

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MandiExpress-Debug-APK
          path: MandiExpress.apk
          retention-days: 30

      - name: Publish to GitHub Releases (Continuous OTA Channel)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MandiExpress Latest Continuous Release"
          body: |
            ## 🚀 MandiExpress Android App (Continuous Release)

            - **Direct APK Download**: [MandiExpress.apk](https://github.com/gahlotanirudh07/veg-mobile-android/releases/latest/download/MandiExpress.apk)
            - **Commit**: `${{ github.sha }}`
            - **Built**: `${{ github.event.head_commit.timestamp || 'Latest Push' }}`
            
            ### ✨ Included Features:
            - 📲 **In-App OTA Self-Updater**: 1-tap download & install directly from within the app.
            - 📈 **Morning Rate Board**: Real-time mandi rates with instant price locks.
            - 📦 **Order Pipeline & Weighment**: Offline-first fulfillment with live synchronization.
            - 🧾 **Digital Khata & Tax Invoices**: Automated ledger & WhatsApp payment reminders.
          files: MandiExpress.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
